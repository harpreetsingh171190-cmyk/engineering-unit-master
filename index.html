<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engineering Unit Master v2.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef1f5;
    color: #222;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 520px;
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
}

h1 {
    text-align: center;
    margin: 0;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

select,
input,
button {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border-radius: 9px;
    border: 1px solid #ccc;
    font-size: 16px;
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    margin-top: 15px;
}

.convert {
    background: #198754;
    color: white;
}

.swap {
    background: #0d6efd;
    color: white;
}

.copy {
    background: #6c757d;
    color: white;
}

.result {
    margin-top: 20px;
    padding: 18px;
    background: #f1f7ff;
    border-radius: 12px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    color: #075bb5;
    word-break: break-word;
}

.history {
    margin-top: 20px;
}

.history h3 {
    margin-bottom: 8px;
}

.history-item {
    padding: 8px;
    margin: 5px 0;
    background: #f5f5f5;
    border-radius: 7px;
    font-size: 14px;
}

.footer {
    text-align: center;
    margin-top: 20px;
    color: #777;
    font-size: 13px;
}

.dark {
    background: #121212;
    color: #eee;
}

.dark .container {
    background: #1e1e1e;
}

.dark input,
.dark select {
    background: #2b2b2b;
    color: white;
    border-color: #555;
}

.dark .result {
    background: #172b40;
}

.dark .history-item {
    background: #292929;
}
</style>
</head>

<body>

<div class="container">

<h1>Engineering Unit Master 📐</h1>
<div class="subtitle">Professional Engineering Unit Converter</div>

<label>Category</label>
<select id="category" onchange="loadUnits()">
    <option value="length">Length</option>
    <option value="area">Area</option>
    <option value="mass">Mass</option>
    <option value="force">Force</option>
    <option value="pressure">Pressure</option>
    <option value="power">Power</option>
    <option value="temperature">Temperature</option>
</select>

<label>Value</label>
<input type="number" id="value" placeholder="Enter value">

<label>From</label>
<select id="from"></select>

<label>To</label>
<select id="to"></select>

<button class="convert" onclick="convert()">Convert ⚙️</button>
<button class="swap" onclick="swapUnits()">Swap 🔄</button>

<div class="result" id="result">
    Result
</div>

<button class="copy" onclick="copyResult()">Copy Result 📋</button>

<div class="history">
    <h3>Calculation History</h3>
    <div id="history"></div>
</div>

<button onclick="toggleDark()">Dark / Light Mode 🌙</button>

<div class="footer">
    Developed by Harpreet Singh
</div>

</div>

<script>

const units = {

length: {
    mm: ["Millimeter (mm)", 0.001],
    cm: ["Centimeter (cm)", 0.01],
    m: ["Meter (m)", 1],
    inch: ["Inch (in)", 0.0254],
    ft: ["Foot (ft)", 0.3048]
},

area: {
    mm2: ["Square Millimeter (mm²)", 0.000001],
    cm2: ["Square Centimeter (cm²)", 0.0001],
    m2: ["Square Meter (m²)", 1],
    ft2: ["Square Foot (ft²)", 0.092903],
    inch2: ["Square Inch (in²)", 0.00064516]
},

mass: {
    g: ["Gram (g)", 0.001],
    kg: ["Kilogram (kg)", 1],
    lb: ["Pound (lb)", 0.453592]
},

force: {
    N: ["Newton (N)", 1],
    kN: ["Kilonewton (kN)", 1000],
    kgf: ["Kilogram-force (kgf)", 9.80665],
    lbf: ["Pound-force (lbf)", 4.44822]
},

pressure: {
    Pa: ["Pascal (Pa)", 1],
    kPa: ["Kilopascal (kPa)", 1000],
    MPa: ["Megapascal (MPa)", 1000000],
    bar: ["Bar", 100000],
    psi: ["PSI", 6894.757]
},

power: {
    W: ["Watt (W)", 1],
    kW: ["Kilowatt (kW)", 1000],
    hp: ["Horsepower (HP)", 745.7]
},

temperature: {
    C: ["Celsius (°C)"],
    F: ["Fahrenheit (°F)"],
    K: ["Kelvin (K)"]
}

};

function loadUnits() {

    const category = document.getElementById("category").value;
    const from = document.getElementById("from");
    const to = document.getElementById("to");

    from.innerHTML = "";
    to.innerHTML = "";

    Object.entries(units[category]).forEach(([key, data]) => {

        from.innerHTML +=
            `<option value="${key}">${data[0]}</option>`;

        to.innerHTML +=
            `<option value="${key}">${data[0]}</option>`;

    });

    if (to.options.length > 1) {
        to.selectedIndex = 1;
    }
}

function convert() {

    const category = document.getElementById("category").value;
    const value = parseFloat(document.getElementById("value").value);
    const from = document.getElementById("from").value;
    const to = document.getElementById("to").value;

    if (isNaN(value)) {
        alert("Please enter a value.");
        return;
    }

    let result;

    if (category === "temperature") {

        result = convertTemperature(value, from, to);

    } else {

        const baseValue =
            value * units[category][from][1];

        result =
            baseValue / units[category][to][1];
    }

    const output =
        `${value} ${from} = ${result.toFixed(6)} ${to}`;

    document.getElementById("result").innerText = output;

    addHistory(output);
}

function convertTemperature(value, from, to) {

    let celsius;

    if (from === "C") celsius = value;
    if (from === "F") celsius = (value - 32) * 5 / 9;
    if (from === "K") celsius = value - 273.15;

    if (to === "C") return celsius;
    if (to === "F") return (celsius * 9 / 5) + 32;
    if (to === "K") return celsius + 273.15;
}

function swapUnits() {

    const from = document.getElementById("from");
    const to = document.getElementById("to");

    const temp = from.value;
    from.value = to.value;
    to.value = temp;
}

function copyResult() {

    const text =
        document.getElementById("result").innerText;

    navigator.clipboard.writeText(text);

    alert("Result copied!");
}

function addHistory(text) {

    const history =
        document.getElementById("history");

    const item =
        document.createElement("div");

    item.className = "history-item";
    item.innerText = text;

    history.prepend(item);

    if (history.children.length > 10) {
        history.removeChild(history.lastChild);
    }
}

function toggleDark() {

    document.body.classList.toggle("dark");
}

loadUnits();

</script>

</body>
</html>
